name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Build wmux-client
        working-directory: packages/wmux-client
        run: bun run build

      - name: Run echoform tests
        working-directory: packages/echoform
        run: bun run test

      # Use the workspace-pinned playwright so the browser revision matches
      # @playwright/test from the lockfile. `bunx playwright` resolves the
      # registry's latest (no root bin exists with isolated installs) and
      # installs a mismatched chromium_headless_shell revision.
      - name: Install Playwright browsers
        working-directory: demo/todo-app
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run Playwright tests (todo-app)
        working-directory: demo/todo-app
        run: bun run test

      - name: Run Playwright tests (file-editor)
        working-directory: demo/file-editor
        run: bun run test

      - name: Run Playwright tests (dev-server)
        working-directory: demo/dev-server
        run: bun run test

      - name: Authenticate to Google Cloud
        if: failure()
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/59831676433/locations/global/workloadIdentityPools/github/providers/springdotnew

      - name: Upload test artifacts
        if: failure()
        run: |
          dest="gs://spring-452820-gha-artifacts/artifacts/echoform/${{ github.run_id }}/playwright-results"
          # The bucket deletes objects one day after customTime.
          expiry="$(date -u -d "+7 days" +%Y-%m-%dT%H:%M:%SZ)"
          uploaded=false
          for dir in demo/*/test-results demo/*/playwright-report; do
            [ -d "$dir" ] || continue
            # One cp per demo: a single cp of every dir would merge all demos into one test-results/.
            app="$(basename "$(dirname "$dir")")"
            gcloud storage cp -r "$dir" "$dest/$app/" --custom-time="$expiry"
            uploaded=true
          done
          if [ "$uploaded" = false ]; then
            echo "::warning::No files were found in demo/*/test-results/ or demo/*/playwright-report/. No artifacts will be uploaded."
            exit 0
          fi
          echo "Playwright results: https://console.cloud.google.com/storage/browser/spring-452820-gha-artifacts/artifacts/echoform/${{ github.run_id }}/playwright-results" >> "$GITHUB_STEP_SUMMARY"
